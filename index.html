<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌍 African Wallet</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<!-- Welcome Screen -->
<section class="welcome">

    <h1>Welcome to Africa 🌍</h1>

    <p>
        Explore detailed information about all 54 African countries,
        including capitals, flags, presidents, currencies, languages,
        population, economy, literacy rates, and major ethnic groups.
    </p>

    <button onclick="startExploring()">
        Explore Africa
    </button>

</section>



<!-- Main App Section -->
<div class="country-container" style="display:none;">


    <h1 class="title">
        🌍 African Wallet
    </h1>


    <input 
        type="text"
        id="countryInput"
        placeholder="Enter an African country name..."
        list="countriesList"
    >



    <!-- Country Suggestions -->
    <datalist id="countriesList">

        <option value="South Sudan">
        <option value="Kenya">
        <option value="Uganda">
        <option value="Tanzania">
        <option value="Ethiopia">
        <option value="Somalia">
        <option value="Nigeria">
        <option value="Ghana">
        <option value="Egypt">
        <option value="South Africa">
        <option value="Democratic Republic of the Congo">
        <option value="Republic of the Congo">

    </datalist>



    <button id="searchBtn">
        Search
    </button>


    <button id="darkBtn">
        Toggle Dark Mode
    </button>



    <!-- Country Results Appear Here -->
    <div id="result"></div>


</div>




<script src="script.js"></script>


</body>

</html>
